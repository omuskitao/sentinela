<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">

    <title>Login | Sentinela</title>

    <style>

        :root {
            --primary: #1677a8;
            --primary-dark: #0d5275;
            --border: #dce4e8;
            --background: #f4f7f9;
            --text: #263238;
            --muted: #6b7880;
            --danger: #c0392b;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .login-page {
            width: 100%;
            max-width: 430px;
        }

        /* ========================================
           CARD
        ======================================== */

        .login-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.07);
        }

        /* ========================================
           CABEÇALHO
        ======================================== */

        .login-header {
            background: linear-gradient(
                135deg,
                #0d5275,
                #1677a8
            );

            color: white;

            padding: 30px;
            text-align: center;
        }

        .system-name {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1.5px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .login-header h1 {
            margin: 0;
            font-size: 30px;
        }

        .login-header p {
            margin: 7px 0 0;
            opacity: 0.88;
            font-size: 14px;
        }

        .hospital-icon {
            width: 62px;
            height: 62px;

            margin: 0 auto 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255,255,255,0.14);

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 14px;

            font-size: 30px;
        }

        /* ========================================
           CORPO
        ======================================== */

        .login-body {
            padding: 28px;
        }

        .login-body h2 {
            margin: 0;
            color: var(--primary-dark);
            font-size: 20px;
        }

        .login-description {
            margin: 6px 0 23px;
            color: var(--muted);
            font-size: 13px;
        }

        /* ========================================
           FORMULÁRIO
        ======================================== */

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        .form-group label {
            font-weight: bold;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 11px 13px;

            border: 1px solid #ccd7dc;
            border-radius: 8px;

            background: white;
            color: var(--text);

            font-size: 14px;
            font-family: inherit;

            outline: none;

            transition:
                border 0.2s,
                box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px rgba(22,119,168,0.10);
        }

        /* ========================================
           BOTÃO
        ======================================== */

        .btn-login {
            width: 100%;

            margin-top: 5px;

            padding: 12px 20px;

            border: none;
            border-radius: 8px;

            background: var(--primary);
            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .btn-login:hover {
            background: var(--primary-dark);
        }

        /* ========================================
           MENSAGEM
        ======================================== */

        #mensagem {
            display: none;

            margin-top: 18px;

            padding: 13px 16px;

            border-radius: 8px;

            background: #fff0ee;
            border: 1px solid #efc4be;

            color: var(--danger);

            font-size: 13px;
            font-weight: bold;

            text-align: center;
        }

        /* ========================================
           RODAPÉ
        ======================================== */

        .login-footer {
            margin-top: 22px;
            padding-top: 18px;

            border-top: 1px solid var(--border);

            text-align: center;

            color: var(--muted);

            font-size: 12px;
            line-height: 1.5;
        }

        /* ========================================
           RESPONSIVO
        ======================================== */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .login-header {
                padding: 25px 20px;
            }

            .login-body {
                padding: 23px;
            }

            .login-header h1 {
                font-size: 26px;
            }
        }

    </style>
</head>


<body>

    <div class="login-page">

        <div class="login-card">

            <!-- CABEÇALHO -->

            <header class="login-header">

                <div class="hospital-icon">
                    🏥
                </div>

                <div class="system-name">
                    SISTEMA HOSPITALAR
                </div>

                <h1>SENTINELA</h1>

                <p>
                    Sistema de Gestão Hospitalar
                </p>

            </header>


            <!-- FORMULÁRIO -->

            <main class="login-body">

                <h2>Acesso ao sistema</h2>

                <p class="login-description">
                    Entre com suas credenciais para acessar o sistema.
                </p>


                <form onsubmit="login(); return false;">

                    <div class="form-group">

                        <label for="usuario">
                            Usuário
                        </label>

                        <input
                            type="text"
                            id="usuario"
                            placeholder="Digite seu usuário"
                            autocomplete="username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn-login"
                    >
                        Entrar no Sistema
                    </button>

                </form>


                <div id="mensagem"></div>


                <div class="login-footer">

                    <strong>SENTINELA</strong><br>

                    Acesso restrito a usuários autorizados.

                </div>

            </main>

        </div>

    </div>


    <script>

        function login() {

            const usuario =
                document.getElementById("usuario").value.trim();

            const senha =
                document.getElementById("senha").value;

            const mensagem =
                document.getElementById("mensagem");


            mensagem.style.display = "none";
            mensagem.textContent = "";


            if (!usuario || !senha) {

                mostrarErro(
                    "Preencha o usuário e a senha."
                );

                return;
            }


            fetch("/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    usuario,
                    senha
                })

            })

            .then(response => {

                if (!response.ok) {
                    throw new Error("Login inválido");
                }

                return response.json();

            })

            .then(data => {

                if (data.tipo === "triagem") {

                    window.location.href =
                        "triagem.html";

                }

                else if (data.tipo === "medico") {

                    window.location.href =
                        "medico.html";

                }

                else if (data.tipo === "atendimento") {

                    window.location.href =
                        "atendimento.html";

                }

                else if (data.tipo === "administracao") {

                    window.location.href =
                        "atendimento.html";

                }

                else {

                    mostrarErro(
                        "Tipo de usuário não reconhecido."
                    );

                }

            })

            .catch(error => {

                console.error(error);

                mostrarErro(
                    "Usuário ou senha incorretos."
                );

            });

        }


        function mostrarErro(texto) {

            const mensagem =
                document.getElementById("mensagem");

            mensagem.textContent =
                "⚠️ " + texto;

            mensagem.style.display = "block";

        }

    </script>

</body>

</html>
