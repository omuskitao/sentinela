<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Médico - Sentinela</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    .acoes-header {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .btn-alta {
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: #198754;
      color: white;
      transition: 0.2s;
    }

    .btn-alta:hover {
      background: #157347;
      transform: translateY(-1px);
    }

    .btn-pdf {
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
      border: none;
      background: white;
      color: var(--primary-color);
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>Painel Médico</h1>

    <p>Gestão e atendimento de pacientes — Sistema Sentinela</p>

    <div class="acoes-header">

      <button
        onclick="window.print()"
        class="btn-pdf">
        📄 Baixar PDF
      </button>

      <button
        onclick="irParaAlta()"
        class="btn-alta">
        🏥 Dar Alta
      </button>

    </div>
  </header>

  <h2>🩺 Painel Médico</h2>

  <div id="triagens"></div>

  <hr>

  <h3>Consulta</h3>

  <input
    id="paciente"
    placeholder="Paciente"
    readonly>

  <input
    id="diagnostico"
    placeholder="Diagnóstico">

  <select id="medicacao">
    <option value="">Selecione a medicação</option>
  </select>

  <textarea
    id="obs"
    placeholder="Observações"></textarea>

  <button onclick="salvar()">
    Salvar Consulta
  </button>

</div>


<script>

let triagensCarregadas = [];


// ========================================
// REDIRECIONAR PARA ALTA
// ========================================

function irParaAlta() {
  window.location.href = "alta.html";
}


// ========================================
// CARREGAR TRIAGENS
// ========================================

function carregar() {

  fetch("/triagens")

    .then(r => r.json())

    .then(data => {

      triagensCarregadas = data;

      const div = document.getElementById("triagens");

      div.innerHTML = "";

      data.forEach((t, index) => {

        div.innerHTML += `

          <div class="card">

            <h3>${t.nome}</h3>

            <p>
              <b>Sintoma:</b>
              ${t.sintoma || "Não informado"}
            </p>

            <p>
              <b>Temperatura:</b>
              ${t.temperatura || "Não informada"}°C
            </p>

            <p>
              <span class="${t.risco}">
                ${t.risco}
              </span>
            </p>

            <p>
              <b>Alergia:</b>
              ${t.alergia || "Nenhuma"}
            </p>

            <p>
              <b>Observação:</b>
              ${t.observacao || "Nenhuma"}
            </p>

            <button onclick="selecionar(${index})">
              Atender
            </button>

          </div>

        `;
      });

    })

    .catch(error => {

      console.error("Erro ao carregar triagens:", error);

      document.getElementById("triagens").innerHTML =
        "<p>Erro ao carregar os pacientes.</p>";

    });
}


// ========================================
// SELECIONAR PACIENTE
// ========================================

function selecionar(index) {

  const t = triagensCarregadas[index];

  document.getElementById("paciente").value = t.nome;

  document.getElementById("obs").value =
    t.observacao || "";

  if (t.alergia && t.alergia !== "Nenhuma") {

    alert(
      "⚠️ Paciente possui alergia: " +
      t.alergia
    );

  }

}


// ========================================
// CARREGAR MEDICAÇÕES
// ========================================

function carregarMedicacoes() {

  fetch("/lista-medicacoes")

    .then(r => r.json())

    .then(data => {

      const select =
        document.getElementById("medicacao");

      select.innerHTML = `
        <option value="">
          Selecione a medicação
        </option>
      `;

      data.forEach(med => {

        const option =
          document.createElement("option");

        option.value = med;

        option.textContent = med;

        select.appendChild(option);

      });

    })

    .catch(error => {

      console.error(
        "Erro ao carregar medicações:",
        error
      );

    });
}


// ========================================
// SALVAR CONSULTA
// ========================================

function salvar() {

  const paciente =
    document.getElementById("paciente").value;

  const diagnostico =
    document.getElementById("diagnostico").value;

  const medicacao =
    document.getElementById("medicacao").value;

  const obs =
    document.getElementById("obs").value;


  if (!paciente) {

    alert(
      "Selecione um paciente clicando em Atender."
    );

    return;
  }


  if (!diagnostico) {

    alert(
      "Informe o diagnóstico."
    );

    return;
  }


  if (!medicacao) {

    alert(
      "Selecione uma medicação."
    );

    return;
  }


  fetch("/consulta", {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({

      paciente,
      diagnostico,
      medicacao,
      obs

    })

  })

  .then(r => {

    if (!r.ok) {
      throw new Error(
        "Erro ao salvar consulta"
      );
    }

    return r.json();

  })

  .then(() => {

    alert("✅ Consulta salva com sucesso!");

    document.getElementById(
      "diagnostico"
    ).value = "";

    document.getElementById(
      "medicacao"
    ).value = "";

    document.getElementById(
      "obs"
    ).value = "";

  })

  .catch(error => {

    console.error(error);

    alert(
      "❌ Não foi possível salvar a consulta."
    );

  });

}


// ========================================
// INICIALIZAÇÃO
// ========================================

carregar();

carregarMedicacoes();

</script>

</body>
</html>
